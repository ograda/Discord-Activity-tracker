[package]
name = "discord-activity-mvp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A tiny cross-platform process watcher that combines selected activities into one Discord Rich Presence"
license = "MIT"

[dependencies]
anyhow = "1.0"
ctrlc = "3.4"
discord-rich-presence = "1.1"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
