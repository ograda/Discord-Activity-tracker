[package]
name = "discord-activity-mvp"
version = "0.3.0"
edition = "2024"
description = "A lightweight Windows process watcher that combines selected activities into one Discord Rich Presence"
license = "MIT"

[dependencies]
anyhow = "1.0"
ctrlc = "3.4"
discord-rich-presence = "1.1"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true